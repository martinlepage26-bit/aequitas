# Host ports are bound to loopback only (127.0.0.1): these services carry
# repo-committed dev credentials and must never be reachable from the LAN.
services:
  postgres:
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    container_name: aequitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aequitas
      POSTGRES_PASSWORD: aequitas_dev
      POSTGRES_DB: aequitas
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aequitas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aequitas -d aequitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (Section 3: "File storage | S3-compatible
  # bucket"). Ports offset from MinIO's 9000/9001 defaults, matching the
  # 5433 pattern above, since this host runs containers for other projects.
  minio:
    # Docker Hub denies anonymous pulls of minio/minio, and quay.io/minio/minio
    # now returns UNAUTHORIZED for anonymous pulls (the token's actions list
    # is empty). Pinning the old digest does not help — the registry refuses
    # the pull. cgr.dev/chainguard/minio is the free public replacement that
    # still allows anonymous pulls; digest is the current image index.
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    container_name: aequitas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aequitas
      MINIO_ROOT_PASSWORD: aequitas_dev_minio
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - aequitas-minio-data:/data
    # Chainguard's image ships /usr/bin/mc and /bin/sh, but not curl or wget,
    # so the old curl live probe can never succeed. `mc ready` is the
    # readiness check CI waits on via Docker's health status.
    healthcheck:
      test: ["CMD-SHELL", "MC_DISABLE_PAGER=1 /usr/bin/mc --disable-pager alias set --config-dir /tmp/mc-health local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && MC_DISABLE_PAGER=1 /usr/bin/mc --disable-pager ready --config-dir /tmp/mc-health local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real virus scanning for evidence uploads (Section 3: "Upload scanning |
  # ClamAV sidecar (dev)"). clamd takes a while to load its signature
  # database on first start — the healthcheck retry budget reflects that.
  clamav:
    image: clamav/clamav@sha256:78810772a92b4a9168115bc6b2e0ffd702640893b9577f8c3d0432762d2655c4
    container_name: aequitas-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - aequitas-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  aequitas-postgres-data:
  aequitas-minio-data:
  aequitas-clamav-data:
